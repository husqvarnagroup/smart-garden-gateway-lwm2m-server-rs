name: Coverage

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

    - name: Install Rust
      run: |
        rustup install stable
        rustup default stable
        rustup component add llvm-tools

    - name: Cache Rust build
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

    - name: Install cargo-llvm-cov
      run: |
        # ~/.cargo/bin is cached, so this only compiles on a cache miss
        which cargo-llvm-cov || cargo install cargo-llvm-cov

    - name: Generate code coverage
      # Threshold is slightly below the current ~50% line coverage;
      # raise it as coverage improves.
      run: cargo llvm-cov --all-features --workspace --summary-only --fail-under-lines 45
