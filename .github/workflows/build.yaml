name: Build and Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_test:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        rust_version: ["1.75", "1.94", "stable", "nightly"]

    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

    - name: Install Rust
      run: |
        rustup install ${{ matrix.rust_version }}
        rustup default ${{ matrix.rust_version }}

    - name: Cache Rust build
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

    - name: Build
      run: |
        cargo --version
        rustc --version
        cargo build --verbose

    - name: Test
      run: |
        cargo --version
        cargo test --verbose

  lint:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

    - name: Install Rust
      run: |
        rustup install stable
        rustup default stable

    - name: Cache Rust build
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

    - name: Clippy
      run: |
        cargo clippy --version
        cargo clippy --all-targets --all-features -- -D warnings

    - name: rustfmt
      run: |
        cargo fmt --version
        cargo fmt --all -- --check

    # The clippy hook reuses the build artifacts from the Clippy step above,
    # so this only re-checks formatting on top of the steps above and ensures that
    # pre-commit works as expected.
    - name: pre-commit
      run: |
        pipx install pre-commit==4.2.0
        pre-commit run --all-files

  typos:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

    - name: Check for typos
      uses: crate-ci/typos@bee27e3a4fd1ea2111cf90ab89cd076c870fce14 # v1.48.0

  gitlint:
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'

    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      with:
        # Full history is needed to lint the whole commit range of the PR
        fetch-depth: 0

    - name: gitlint
      run: |
        # The gitlint package is a meta-package; the executable is in gitlint-core
        pipx install gitlint-core==0.19.1
        gitlint --version
        gitlint --commits ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
