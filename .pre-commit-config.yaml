repos:
  - repo: local
    hooks:
    - id: rust-fmt
      name: Rust format
      description: Run cargo fmt on files
      entry: cargo fmt --all --
      pass_filenames: false
      types: [file, rust]
      language: system
    - id: rust-clippy
      name: Rust clippy
      description: Run cargo clippy on files
      entry: cargo clippy --all-targets --all-features -- -D warnings
      pass_filenames: false
      types: [file, rust]
      language: system
    - id: python-format
      name: Python format
      description: Run ruff format on the component tests
      entry: uv run --project component-tests ruff format component-tests
      pass_filenames: false
      types: [file, python]
      language: system
    - id: python-lint
      name: Python lint
      description: Run ruff check on the component tests
      entry: uv run --project component-tests ruff check component-tests
      pass_filenames: false
      types: [file, python]
      language: system
