[package]
name = "lwm2mserver-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.75.0"

[lib]
name = "lwm2mserver_rs"
path = "src/lib.rs"

[dev-dependencies]
tempfile = "=3.24.0" # held back for Rust 1.75.0

[dependencies]
aes            = "0.8"
anyhow         = "1"
base64         = "0.22"
ciborium       = "0.2"
clap           = { version = "4.5.61", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
coap-lite      = "0.11"
p256           = { version = "0.13", default-features = false, features = ["ecdh", "pkcs8", "ecdsa", "std"] }
quick-xml      = "0.36"
rand_core      = { version = "0.6", default-features = false, features = ["getrandom"] }
serde          = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json     = { version = "1", default-features = false, features = ["std"] }
socket2        = { version = "0.5", default-features = false, features = ["all"] }
thiserror      = "1"
tokio          = { version = "1", default-features = false, features = ["net", "time", "sync", "rt-multi-thread", "macros", "signal", "io-util"] }
tokio-util     = { version = "0.7", default-features = false, features = ["rt"] }
tracing        = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "ansi"] }
x509-cert      = { version = "0.2", default-features = false }

# Transitive dependencies held back for Yocto/Rust 1.75.0
clap_lex = "=1.0.1"
getrandom = "=0.3.0"
sd-notify = "0.4.5"

[package.metadata.cargo-machete]
# Ignored as that are pinned transitive dependencies
ignored = ["clap_lex", "getrandom"]

[profile.release]
opt-level     = "z"
lto           = true
codegen-units = 1
# no strip = true: Yocto strips binaries itself (QA error already-stripped)
# panic = "abort" not possible: Yocto's Rust toolchain ships all std crates
# (including panic_abort) built with -C panic=unwind
