[package]
name = "lwm2mserver-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.75.0"

[lib]
name = "lwm2mserver_rs"
path = "src/lib.rs"

[dev-dependencies]
tempfile = "=3.24.0" # held back for Rust 1.75.0

[dependencies]
tokio          = { version = "1", features = ["net", "time", "sync", "rt-multi-thread", "macros", "signal", "io-util"] }
coap-lite      = "0.11"
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"
thiserror      = "1"
tracing        = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes          = "1"
tokio-util     = { version = "0.7", features = ["rt"] }
anyhow         = "1"
clap           = { version = "4.5.61", features = ["derive"] }
socket2        = { version = "0.5", features = ["all"] }
p256           = { version = "0.13", features = ["ecdh", "pkcs8", "ecdsa"] }
x509-cert      = { version = "0.2", default-features = false }
aes            = "0.8"
rand_core      = { version = "0.6", features = ["getrandom"] }
ciborium       = "0.2"
quick-xml      = "0.36"
base64         = "0.22"
sd-notify = "0.4.5" # held back for Rust 1.75.0

# Transitive dependencies held back for Yocto/Rust 1.75.0
clap_lex = "=1.0.1"
getrandom = "=0.3.0"

[profile.release]
opt-level     = "z"
lto           = true
codegen-units = 1
# no strip = true: Yocto strips binaries itself (QA error already-stripped)
# panic = "abort" not possible: Yocto's Rust toolchain ships all std crates
# (including panic_abort) built with -C panic=unwind
